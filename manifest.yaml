version: 0.1.0
quality_goals:
  parity:
    oracle: Pillow 12.2.0
    contract: Every active manifest row must match Pillow's observable input/output behavior exactly, including decoded pixels and encoded bytes.
  coverage:
    target: 100% line, function, branch, and region coverage
    method: Prefer fixture-based, manifest-driven parity rows that exercise real codec inputs and Pillow reference outputs.
    fallback: Coverage-only internal hooks may exercise private unreachable or defensive branches, but should stay behind cfg(coverage) and should not replace fixture parity coverage for codec behavior.
reference_oracles:
  primary:
    implementation: Pillow
    version: 12.2.0
    python: '3.12'
    profile: pillow-12.2.0-cp312-macos-arm64
    platform: macosx_11_0_arm64
    wheel: pillow-12.2.0-cp312-cp312-macosx_11_0_arm64.whl
    wheel_sha256: f3f40b3c5a968281fd507d519e444c35f0ff171237f4fdde090dd60699458421
    imaging_extension_sha256: ed534830281dd092be3755632eac8422cdee53d2d8f045ff1779a7d795414d26
    contract: Public Pillow status, errors, mode, size, frame data, metadata, decoded pixels, and encoded bytes are authoritative.
  formats:
    jpeg:
      implementation: Pillow JPEG
      version: 3.1.4.1
      pillow_feature: libjpeg_turbo
      pillow_feature_version: 3.1.4.1
    png:
      implementation: Pillow PNG
      version: libImaging 12.2.0 / zlib-ng 2.3.3
      pillow_feature: zlib_ng
      pillow_feature_version: 2.3.3
    gif:
      implementation: Pillow GIF
      version: libImaging 12.2.0 tag 3c41c09
    bmp:
      implementation: Pillow BMP
      version: libImaging 12.2.0 tag 3c41c09
    tiff:
      implementation: Pillow TIFF
      version: 4.7.1
      pillow_feature: libtiff
      pillow_feature_version: 4.7.1
    webp:
      implementation: Pillow WebP
      version: 1.6.0
      pillow_feature: webp
      pillow_feature_version: 1.6.0
    ico:
      implementation: Pillow ICO
      version: ICO/CUR format specification plus libImaging 12.2.0 behavior
    avif:
      implementation: Pillow AVIF
      version: libavif 1.4.1 / dav1d 1.5.3 / libaom 3.13.2
      pillow_feature: avif
      pillow_feature_version: 1.4.1
