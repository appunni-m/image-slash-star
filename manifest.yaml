  gif:
    name: GIF
    extensions:
    - .gif
    magic:
    - 71
    - 73
    - 70
    decoder: own (GIF89a parser and LZW)
    encoder: own (GIF89a, LZW, interlace, transparency, disposal, looping, repeated-frame animation)
    status: in-progress
    verification_scope: header_only
    encode_source:
      format: gif
      asset: static.gif
    planned_gap_defaults:
      decode: Rust GIF decoding does not yet match Pillow for this declared input mode.
      encode: Rust GIF encoding does not yet match Pillow for this declared save operation.
    edge_cases:
    - id: static_gif
      description: Single frame GIF
      rust_decode_with_token: true
      test_assets:
      - static.gif
    - id: animated_gif
      description: Animated GIF (decode first frame)
      test_assets:
      - animated.gif
      - animated_3frame.gif
    - id: transparent
      description: GIF with transparency index
      test_assets:
      - transparent.gif
    - id: interlaced
      description: Interlaced GIF
      test_assets:
      - interlaced.gif
    - id: color_table_global
      description: Global color table only
      test_assets:
      - global_ct.gif
    - id: color_table_local
      description: Local per-frame color table
      test_assets:
      - local_ct.gif
      - local_palette_only.gif
    - id: palette_absent
      description: Pillow exposes palette-less GIF samples as luminance bytes
      rust_decode_with_metadata_limit: 13772
      test_assets:
      - no_palette.gif
      - animated_no_palette.gif
      - animated_no_palette_second_frame_no_local_table.gif
    - id: ignored_extension
      description: Comment extension sub-blocks are skipped before image data
      test_assets:
      - comment_extension.gif
      - unknown_application.gif
    - id: alternate_loop_extension
      description: Pillow leaves ANIMEXTS1.0 opaque and accepts malformed or short loop payloads
      test_assets:
      - animext_loop.gif
      - animext_bad_payload.gif
      - short_loop_payload.gif
      - bad_loop_payload.gif
    - id: extension_gce
      description: Graphic Control Extension (delay, disposal)
