      rust_error_kind: unsupported
      rust_error_reason: WebP cannot represent retained interlace state
    - id: enc_error_sequence_default_image
      description: WebP rejects retained default-image state because ANMF has no default-image field
      source_asset: animated.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'sequence_default_image': true}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: WebP cannot represent retained default-image state
    - id: enc_error_sequence_reserved_disposal
      description: WebP rejects a reserved retained disposal value rather than silently changing it
      source_asset: animated.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'sequence_disposal': 'reserved:3'}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: The keyframe encoder cannot replay reserved presentation controls
    - id: enc_error_sequence_reserved_blend
      description: WebP rejects a reserved retained blend value rather than silently changing it
      source_asset: animated.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'sequence_blend': 'reserved:3'}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: The keyframe encoder cannot replay reserved presentation controls
    - id: enc_error_sequence_fractional_duration
      description: WebP rejects an exact duration that cannot be represented as integral milliseconds
      source_asset: animated.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'sequence_duration_fraction': [1, 3]}
      rust_expect_error: true
      rust_error_kind: parameter
      rust_error_reason: WebP ANMF durations are integral milliseconds
    - id: enc_error_sequence_zero_duration_denominator
      description: The common sequence model rejects a zero duration denominator before codec dispatch
      source_asset: animated.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'sequence_duration_fraction': [1, 0]}
      rust_expect_error: true
      rust_error_kind: parameter
      rust_error_reason: Retained frame duration denominators must be non-zero
    - id: enc_error_sequence_duration_overflow
      description: WebP rejects retained durations larger than its 24-bit millisecond field
      source_asset: animated.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'sequence_duration_ms': 16777216}
      rust_expect_error: true
      rust_error_kind: parameter
      rust_error_reason: WebP ANMF durations are unsigned 24-bit millisecond values
