      test_assets:
      - bmp_4bit_two_entry_red_green.ico
    - id: bmp_4bpp_two_entry_near_gray_palette
      description: Near-white second palette entry remains indexed rather than monochrome
      test_assets:
      - bmp_4bit_two_entry_near_gray.ico
    - id: bmp_4bpp_missing_palette_index
      description: Missing indexed palette references decode as black like Pillow
      test_assets:
      - bmp_4bit_missing_palette_index.ico
    - id: bmp_short_palette_leniency
      description: Pillow decodes an 8-bit ICO DIB whose explicit palette count is shorter than its stored indices
      test_assets:
      - bmp_8bit_short_palette.ico
    - id: cursor
