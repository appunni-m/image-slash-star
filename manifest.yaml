    encode_edge_cases:
    - id: enc_sequence_lossy_rgb_keyframes
      description: Two rendered RGB canvases encode as exact full-canvas lossy WebP keyframes
      source_asset: animated.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': False, 'quality': 80, 'method': 4, 'kmax': 1}
    - id: enc_sequence_lossless_rgb_background
      description: Lossless RGB keyframes retain the decoded WebP animation background
      source_asset: animated_rgb_palette_background.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1}
    - id: enc_sequence_lossy_rgba_keyframes
      description: Two rendered RGBA canvases encode as exact ALPH plus VP8 keyframes
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': False, 'quality': 80, 'method': 4, 'loop': 2, 'background': [0, 0, 0, 0], 'kmax': 1}
    - id: enc_sequence_lossless_rgba_keyframes
      description: Two rendered RGBA canvases encode as exact VP8L keyframes
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'loop': 2, 'background': [0, 0, 0, 0], 'kmax': 1}
    - id: enc_sequence_lossless_default_controls
      description: A full-canvas source layout plus absent retained controls map exactly to WebP defaults
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'sequence_pixel_layout': 'source_rectangle', 'sequence_clear_loop': true, 'sequence_clear_background': true}
    - id: enc_error_sequence_loop_overflow
      description: WebP rejects retained loop counts larger than its 16-bit field
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'sequence_loop_count': 65536}
      rust_expect_error: true
      rust_error_kind: parameter
      rust_error_reason: WebP animation loop counts are unsigned 16-bit values
    - id: enc_error_sequence_quality
      description: Animated WebP rejects quality above the same 0 through 100 boundary as still output
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': False, 'quality': 101, 'method': 4, 'kmax': 1}
      expect_error: true
    - id: enc_error_sequence_frame_mode
      description: A valid retained sequence with an unsupported frame mode returns a structured error
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'sequence_frame_mode': 'La16'}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: WebP sequence frames obey the same exact direct-mode contract as still images
    - id: enc_error_sequence_palette_background
      description: WebP rejects a retained palette-index background because ANIM stores RGBA
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'sequence_background_palette': 0}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: WebP animation backgrounds are explicit RGBA values
    - id: enc_error_sequence_icc
      description: Sequence ICC output remains unsupported until animated metadata ordering has an exact contract
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'icc_hex': '01020304'}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: WebP sequence metadata output is not implemented
    - id: enc_error_sequence_exif
      description: Sequence EXIF output remains unsupported until animated metadata ordering has an exact contract
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'exif_hex': '4578696600000102'}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: WebP sequence metadata output is not implemented
    - id: enc_error_sequence_xmp
      description: Sequence XMP output remains unsupported until animated metadata ordering has an exact contract
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'xmp_hex': '3c783e3c2f783e'}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: WebP sequence metadata output is not implemented
    - id: enc_error_sequence_kmax
      description: The initial exact keyframe encoder rejects non-keyframe-only kmax settings
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmin': 1, 'kmax': 2}
      rust_expect_error: true
      rust_error_kind: parameter
      rust_error_reason: The exact initial WebP sequence contract requires kmax=1
    - id: enc_error_sequence_minimize_size
      description: WebP frame minimization remains unsupported by the initial exact keyframe encoder
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'minimize_size': true}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: WebP animation optimization options are not implemented
    - id: enc_error_sequence_kmin
      description: WebP minimum keyframe distance remains unsupported by the initial exact keyframe encoder
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmin': 3}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: WebP animation optimization options are not implemented
    - id: enc_error_sequence_allow_mixed
      description: Mixed lossy and lossless WebP frames remain unsupported by the initial exact keyframe encoder
      source_asset: animated_sequence_rgba_keyframes.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'quality': 80, 'method': 4, 'kmax': 1, 'allow_mixed': true}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: WebP animation optimization options are not implemented
    - id: enc_error_sequence_left
      description: A left-offset source rectangle cannot be emitted by the full-canvas keyframe encoder
      source_asset: animated.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'sequence_canvas_padding': [1, 0], 'sequence_frame_offset': [1, 0]}
