  bmp:
    name: BMP
    extensions:
    - .bmp
    magic:
    - 66
    - 77
    decoder: own (direct impl)
    encoder: own (8/24/32-bit BI_RGB, 32-bit BI_BITFIELDS, top-down rows, V3/V4/V5 headers)
