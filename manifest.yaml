    encode_edge_cases:
    - id: enc_error_public_mode_contract
      description: Every unsupported AVIF public ImageMode and one inconsistent color/mode state return structured errors without panicking
      source_format: png
      source_asset: 1x1.png
      params:
        rust_unsupported_modes: ['L16', 'La16', 'Rgb16', 'Rgba16', 'Rgb32F', 'Rgba32F', 'F32', 'I32']
        rust_invalid_color_mode: true
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: The pure-Rust AVIF boundary currently accepts L1, P8, L8, La8, Rgb8, Rgba8, and Cmyk8
    - id: enc_error_retained_sequence_left
      description: AVIF sequence encoding cannot retain a horizontally offset source frame
      params: {'sequence_canvas_padding': [1, 0], 'sequence_frame_offset': [1, 0]}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: The current AVIF sequence encoder requires source frames at the canvas origin
    - id: enc_error_retained_sequence_top
      description: AVIF sequence encoding cannot retain a vertically offset source frame
      params: {'sequence_canvas_padding': [0, 1], 'sequence_frame_offset': [0, 1]}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: The current AVIF sequence encoder requires source frames at the canvas origin
    - id: enc_error_retained_sequence_width
      description: AVIF sequence encoding cannot retain a source frame narrower than its canvas
      params: {'sequence_canvas_padding': [1, 0]}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: The current AVIF sequence encoder requires every source rectangle to fill the canvas
    - id: enc_error_retained_sequence_height
      description: AVIF sequence encoding cannot retain a source frame shorter than its canvas
      params: {'sequence_canvas_padding': [0, 1]}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: The current AVIF sequence encoder requires every source rectangle to fill the canvas
    - id: enc_error_retained_sequence_disposal
      description: AVIF sequence encoding cannot retain GIF or APNG disposal metadata
      params: {'sequence_disposal': 'keep'}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: The current AVIF sequence encoder has no disposal mapping
    - id: enc_error_retained_sequence_blend
      description: AVIF sequence encoding cannot retain WebP or APNG blend metadata
      params: {'sequence_blend': 'over'}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: The current AVIF sequence encoder has no blend mapping
    - id: enc_error_retained_sequence_interlace
      description: AVIF sequence encoding cannot retain GIF frame-interlace storage metadata
      params: {'sequence_interlaced': true}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: AVIF has no GIF frame-interlace metadata equivalent
    - id: enc_error_retained_sequence_default_image
      description: AVIF sequence encoding cannot retain APNG default-image identity
      params: {'sequence_default_image': true}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: The current AVIF sequence encoder has no default-image mapping
