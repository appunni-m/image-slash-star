  tiff:
    name: TIFF
    extensions:
    - .tiff
    - .tif
    magic:
    - 73
    - 73
    - 42
    - 0
    magic_alt:
    - 77
    - 77
    - 0
    - 42
    decoder: own (classic TIFF IFDs, strips, PackBits, LZW, Deflate)
    encoder: own (classic TIFF strips, endian selection, PackBits/LZW/Deflate, horizontal predictor)
    status: in-progress
    verification_scope: header_only
    encode_source:
      format: tiff
      asset: rgb.tiff
    planned_gap_defaults:
      decode: Rust TIFF decoding does not yet match Pillow for this declared input mode.
      encode: Rust TIFF encoding does not yet match Pillow for this declared save operation.
    edge_cases:
    - id: byte_order_le
      description: Little-endian TIFF (II)
      test_assets:
      - le.tiff
    - id: byte_order_be
      description: Big-endian TIFF (MM)
      test_assets:
      - be.tiff
    - id: registered_header_variants_over_classic_ifd
      description: Pillow accepts legacy swapped-magic and BigTIFF signatures over these classic IFD payloads
      test_assets:
      - legacy_le_swapped_magic.tiff
      - legacy_be_swapped_magic.tiff
