formats:
  jpeg:
    name: JPEG
    extensions:
    - .jpg
    - .jpeg
    magic:
    - 255
    - 216
    decoder: own (Pillow 12.2.0 parity target)
    encoder: own (Pillow 12.2.0 parity target)
    status: in-progress
    verification_scope: structure
    encode_source:
      format: jpeg
      asset: baseline_444.jpg
    planned_gap_defaults:
      decode: Rust JPEG decoding does not yet match Pillow for this declared input mode.
      encode: Rust JPEG encoding does not yet match Pillow for this declared save operation.
    edge_cases:
    - id: subsampling_444
      description: 4:4:4 chroma subsampling (no subsampling)
      test_assets:
      - baseline_444.jpg
    - id: baseline_444_unused_custom_ac_table
      description: Baseline 4:4:4 JPEG defines an unused AC DHT with standard luma code counts and a changed symbol order
      test_assets:
      - baseline_444_unused_custom_ac_table.jpg
    - id: baseline_444_single_scan_trailing_dqt
      description: Baseline 4:4:4 JPEG redefines a quantization table after its only entropy scan
      test_assets:
      - baseline_444_single_scan_trailing_dqt.jpg
    - id: baseline_444_single_scan_empty_trailing_dqt
      description: Baseline 4:4:4 JPEG has an empty trailing DQT segment accepted by Pillow
      test_assets:
      - baseline_444_single_scan_empty_trailing_dqt.jpg
    - id: baseline_444_single_scan_dqt_marker_fill
      description: Baseline 4:4:4 JPEG adds a fill byte before its trailing DQT marker
      test_assets:
      - baseline_444_single_scan_dqt_marker_fill.jpg
    - id: baseline_444_multiscan_ss_nonzero
      description: Baseline component scan has a nonzero Ss value tolerated by Pillow
      test_assets:
      - baseline_444_multiscan_ss_nonzero.jpg
    - id: baseline_444_multiscan_duplicate_component
      description: Baseline multi-scan JPEG scans component 2 twice and leaves Y at neutral samples
      test_assets:
      - baseline_444_multiscan_duplicate_component.jpg
    - id: baseline_444_multiscan_missing_component
      description: Baseline multi-scan JPEG ends after Y and Cb scans without a Cr scan
      test_assets:
      - baseline_444_multiscan_missing_component.jpg
    - id: baseline_444_multiscan_empty_entropy
      description: Baseline multi-scan JPEG has an empty first component scan accepted by Pillow
      test_assets:
      - baseline_444_multiscan_empty_entropy.jpg
    - id: baseline_444_multiscan_final_empty_entropy
      description: Baseline multi-scan JPEG has an empty final component scan immediately before EOI
      test_assets:
      - baseline_444_multiscan_final_empty_entropy.jpg
    - id: baseline_444_multiscan_interleaved_restart
      description: Baseline JPEG combines an interleaved component scan with one-MCU restart segments
      test_assets:
      - baseline_444_multiscan_interleaved_restart.jpg
    - id: baseline_444_multiscan_restart_overrun
      description: Baseline multi-scan JPEG has extra restart markers after the final MCU
      test_assets:
      - baseline_444_multiscan_restart_overrun.jpg
    - id: baseline_444_multiscan_duplicate_component_dc_only
      description: A repeated component scan preserves Pillow parity when every block has only DC coefficients
      test_assets:
      - baseline_444_multiscan_duplicate_component_dc_only.jpg
    - id: baseline_444_three_sequential_scans
      description: Baseline 4:4:4 JPEG encodes Cb, Y, and Cr in separate non-interleaved sequential scans
      test_assets:
      - baseline_444_three_sequential_scans.jpg
    - id: baseline_444_single_component_scan_cb
      description: Baseline 4:4:4 JPEG ends after a single Cb component scan accepted by Pillow
      test_assets:
      - baseline_444_single_component_scan_cb.jpg
    - id: baseline_444_three_scans_dqt_redefined
      description: Baseline 4:4:4 multi-scan JPEG redefines the Cb quantization table between component scans
      test_assets:
      - baseline_444_three_scans_dqt_redefined.jpg
    - id: baseline_444_multiscan_duplicate_dht_after_snapshot
      description: Baseline 4:4:4 multi-scan JPEG repeats Huffman-table markers between the first two component scans
      test_assets:
      - baseline_444_multiscan_duplicate_dht_after_snapshot.jpg
    - id: baseline_444_multiscan_duplicate_dqt_after_snapshot
      description: Baseline 4:4:4 multi-scan JPEG repeats a DQT marker after the first scan snapshots its tables
      test_assets:
      - baseline_444_multiscan_duplicate_dqt_after_snapshot.jpg
    - id: subsampling_422
      description: 4:2:2 horizontal chroma subsampling
      test_assets:
      - baseline_422.jpg
    - id: baseline_422_entropy_truncated_tail_64
      description: Baseline 4:2:2 JPEG with 64 entropy bytes removed before the end marker
      test_assets:
      - baseline_422_entropy_truncated_tail_64.jpg
    - id: baseline_444_entropy_truncated_tail_64
      description: Baseline 4:4:4 JPEG with 64 entropy bytes removed before the end marker
      test_assets:
      - baseline_444_entropy_truncated_tail_64.jpg
    - id: subsampling_420
      description: 4:2:0 chroma subsampling (most common)
      test_assets:
      - baseline_420.jpg
    - id: subsampling_411
      description: 4:1:1 chroma subsampling
      test_assets:
      - baseline_411.jpg
    - id: subsampling_gray
      description: Grayscale (no chroma components)
      test_assets:
      - baseline_gray.jpg
    - id: idct_high_horizontal_frequencies
      description: Restart-separated grayscale blocks isolate horizontal AC frequencies 3 through 7 and a vertical-only AC coefficient to exercise every scalar IDCT row shortcut outcome
      test_assets:
      - idct_high_horizontal_frequencies.jpg
    - id: baseline_ac_pair_tail
      description: Grayscale AC symbol run at the final coefficient exercises the fast lookup block-tail fallback with Pillow pixel parity
      test_assets:
      - baseline_ac_pair_tail.jpg
    - id: baseline_reserved_ac_zero_size_eob
      description: Grayscale reserved zero-size AC symbol follows Pillow's EOB behavior with exact pixel parity
      test_assets:
      - baseline_reserved_ac_zero_size_eob.jpg
    - id: baseline_multiscan_reserved_ac_zero_size_eob
      description: 4:4:4 multiscan reserved zero-size AC symbol exercises Pillow's EOB behavior in the scalar decoder
      test_assets:
      - baseline_multiscan_reserved_ac_zero_size_eob.jpg
    - id: color_ycbcr
      description: YCbCr color space (standard)
      test_assets:
      - baseline_ycbcr.jpg
    - id: color_rgb
      description: RGB color space (rare, Adobe)
      test_assets:
      - baseline_rgb_jpeg.jpg
    - id: color_cmyk
      description: CMYK color space (Adobe)
      test_assets:
