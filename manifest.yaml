      rust_error_reason: The initial WebP sequence encoder emits full-canvas keyframes
    - id: enc_error_sequence_height
      description: A source rectangle shorter than its canvas cannot be emitted by the full-canvas keyframe encoder
      source_asset: animated.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'sequence_canvas_padding': [0, 1]}
      rust_expect_error: true
