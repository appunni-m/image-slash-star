      description: Odd-sized baseline CMYK image exercises partial MCU row interleave
      test_assets:
      - baseline_cmyk_13x9.jpg
    - id: baseline_cmyk_single_component_scan
      description: Four-component baseline CMYK JPEG ends after the first component scan and uses the safe reconstruction fallback
      test_assets:
      - baseline_cmyk_single_component_scan_c.jpg
    - id: baseline_cmyk_height_partial_aligned_width
      description: Baseline CMYK image with MCU-aligned width and partial final MCU row exercises the aligned-width height fallback
      test_assets:
      - baseline_cmyk_height_partial_8x9.jpg
    - id: baseline_cmyk_entropy_truncated_tail_64
      description: Baseline CMYK entropy data truncated by 64 bytes before EOI exercises the direct decoder fallback
      test_assets:
