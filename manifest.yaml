  ico:
    name: ICO/CUR
    extensions:
    - .ico
    - .cur
    magic:
    - 0
    - 0
    - 1
    - 0
    alternate_magic:
    - 0
    - 0
    - 2
    - 0
    decoder: own (BMP/PNG wrapper)
    encoder: own
    status: in-progress
    verification_scope: header_only
    encode_source:
      format: ico
      asset: 16x16.ico
    planned_gap_defaults:
      decode: Rust ICO decoding does not yet match Pillow for this declared input mode.
      encode: Rust ICO encoding does not yet match Pillow for this declared save operation.
    edge_cases:
    - id: single_icon
      description: Single icon entry
      rust_decode_with_metadata_limit: 22
      test_assets:
      - single.ico
    - id: multi_res
      description: Multiple resolution entries
      test_assets:
      - multi.ico
      - multi_descending.ico
    - id: png_entry
      description: ICO with embedded PNG data
      test_assets:
      - png_entry.ico
    - id: bmp_entry
      description: ICO with embedded BMP data (classic)
      test_assets:
      - bmp_entry.ico
    - id: bmp_depths
      description: Pillow BMP-in-ICO entries at indexed and true-color depths
      test_assets:
      - bmp_1bit.ico
      - bmp_4bit.ico
      - bmp_8bit.ico
      - bmp_32bit.ico
    - id: bmp_default_palette
      description: Indexed BMP entry using the implicit full palette size
      test_assets:
      - bmp_default_palette.ico
    - id: bmp_1bit_default_palette
      description: One-bit BMP entry uses its implicit two-color palette when colors_used is zero
      test_assets:
      - bmp_1bit_default_palette.ico
    - id: bmp_8bit_default_palette
      description: Eight-bit BMP entry uses its implicit 256-color palette when colors_used is zero
      test_assets:
      - bmp_8bit_default_palette.ico
    - id: bmp_mask_transparency
      description: 24-bit BMP entry transparency supplied by the ICO AND mask
      test_assets:
      - bmp_24bit_transparent.ico
    - id: bmp_odd_width
      description: Packed one-bit BMP entry with a partial final source byte
      test_assets:
      - bmp_1bit_odd.ico
    - id: bmp_4bpp_odd_width
      description: Identity grayscale palette promotes the odd-width DIB to luminance bytes
      test_assets:
      - bmp_4bit_odd_width.ico
    - id: bmp_4bpp_odd_width_gray_palette_control
      description: Non-identity grayscale palette remains indexed at the partial final nibble
      test_assets:
      - bmp_4bit_odd_width_gray_control.ico
    - id: bmp_4bpp_odd_width_binary_palette
      description: Two-color black-and-white palette follows Pillow's one-bit raw interpretation
      test_assets:
      - bmp_4bit_odd_width_binary_gray.ico
    - id: bmp_4bpp_odd_width_binary_palette_white_first
      description: Black-and-white packed bits include a white first pixel
      test_assets:
      - bmp_4bit_odd_width_binary_gray_white_first.ico
