      description: WebP rejects retained interlace state because ANMF has no interlace field
      source_asset: animated.webp
      params: {'animated': True, 'frames': 2, 'preserve_duration': True, 'lossless': True, 'method': 4, 'kmax': 1, 'sequence_interlaced': true}
