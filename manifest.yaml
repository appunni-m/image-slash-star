cross_format:
  detect:
  - id: jpeg_as_jpeg
    input: baseline.jpg
    expected_format: jpeg
  - id: png_as_png
    input: rgb.png
    expected_format: png
  - id: jpeg_with_png_ext
    input: actually_jpeg.png
    expected_format: jpeg
    notes: Format detection by magic bytes, not extension
  - id: empty_file
    input: empty.bin
    expected_format: null
    expect_error: true
  - id: random_data
    input: random.bin
    expected_format: null
    expect_error: true
