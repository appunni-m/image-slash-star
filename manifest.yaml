    encode_edge_cases:
    - id: enc_error_retained_sequence_geometry
      description: A still JPEG cannot represent a retained frame offset or a larger sequence canvas
      params: {'sequence_canvas_padding': [1, 1], 'sequence_frame_offset': [1, 1]}
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: JPEG has no one-frame sequence geometry fields
    - id: enc_error_public_mode_contract
      description: Every unsupported public ImageMode and one inconsistent color/mode state return structured errors without panicking
      source_format: png
      source_asset: 1x1.png
      params:
        rust_unsupported_modes: ['P', 'La8', 'Rgba8', 'L16', 'La16', 'Rgb16', 'Rgba16', 'Rgb32F', 'Rgba32F', 'F32', 'I32']
        rust_invalid_color_mode: true
      rust_expect_error: true
      rust_error_kind: unsupported
      rust_error_reason: JPEG directly accepts L1, L8, Rgb8, and Cmyk8
