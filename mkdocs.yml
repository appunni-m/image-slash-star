site_name: image-slash-star
site_description: Rust image codecs with explicit capability and benchmark evidence.
site_url: https://appunni-m.github.io/image-slash-star/
repo_url: https://github.com/appunni-m/image-slash-star
repo_name: appunni-m/image-slash-star
docs_dir: target/docs-source
site_dir: target/site
use_directory_urls: true
strict: true
theme:
  name: material
  font: false
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
extra_css:
  - assets/docs.css
extra_javascript:
  - assets/evidence.js
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Overview: index.md
  - Use:
      - Installation and API usage: usage.md
      - Supported formats and limitations: maturity.md
  - Benchmark results: benchmarks.md
  - Contribute:
      - Contributor guide: contributing.md
      - Development and commands: testing.md
      - Run benchmarks: benchmarking.md
      - Benchmark measurement details: benchmark-details.md
      - Detailed codec reference: capabilities.md
      - AVIF implementation scope: avif.md
      - Compatibility evidence: evidence.md
      - Architecture: architecture.md
      - JPEG implementation: jpeg.md
      - Implementation roadmap: roadmap.md
      - Documentation maintenance: documentation.md
      - Release process: releasing.md
  - Project:
      - Releases: https://github.com/appunni-m/image-slash-star/releases
      - Changelog: changelog.md
      - Support: support.md
      - Security: security.md
      - Code of conduct: conduct.md
