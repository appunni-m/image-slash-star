name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  workflow_run:
    workflows: [Benchmark, Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Keep skipped workflow_run events from cancelling a useful main build.
  group: >-
    documentation-${{
      github.event_name == 'workflow_run' &&
      !(github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        ((github.event.workflow_run.name == 'Benchmark' &&
          github.event.workflow_run.head_branch == 'main' &&
          (github.event.workflow_run.event == 'push' ||
           github.event.workflow_run.event == 'schedule' ||
           github.event.workflow_run.event == 'workflow_dispatch')) ||
         (github.event.workflow_run.name == 'Release' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_branch, 'v')))) &&
      format('ineligible-workflow-run-{0}', github.run_id) ||
      github.event.pull_request.number ||
      github.ref_name
    }}
  cancel-in-progress: true

jobs:
  benchmark-data:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        ((github.event.workflow_run.name == 'Benchmark' &&
          github.event.workflow_run.head_branch == 'main' &&
          (github.event.workflow_run.event == 'push' ||
           github.event.workflow_run.event == 'schedule' ||
           github.event.workflow_run.event == 'workflow_dispatch')) ||
         (github.event.workflow_run.name == 'Release' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_branch, 'v')))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.benchmark.outputs.run_id }}
      head_sha: ${{ steps.benchmark.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'workflow_run' || github.event_name == 'schedule') && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Select the latest successful main benchmark
        id: benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/select_docs_benchmark.py
      - name: Download data from the successful main benchmark
        if: steps.benchmark.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-benchmark
          path: target/public-benchmark
          github-token: ${{ github.token }}
          run-id: ${{ steps.benchmark.outputs.run_id }}
      - name: Forward the validated snapshot to the documentation build
        if: steps.benchmark.outputs.run_id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-benchmark-snapshot
          overwrite: true
          path: target/public-benchmark/snapshot.json
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [benchmark-data]
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    # CI runs PR documentation checks in its stable required-check aggregate.
    if: >-
      github.event_name != 'pull_request' &&
      always() &&
      needs.benchmark-data.result == 'success' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        ((github.event.workflow_run.name == 'Benchmark' &&
          github.event.workflow_run.head_branch == 'main' &&
          (github.event.workflow_run.event == 'push' ||
           github.event.workflow_run.event == 'schedule' ||
           github.event.workflow_run.event == 'workflow_dispatch')) ||
         (github.event.workflow_run.name == 'Release' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_branch, 'v')))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'workflow_run' || github.event_name == 'schedule') && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - name: Record the site source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install the hash-locked documentation tools
        run: make docs-setup PYTHON=python
      - name: Verify the documented published release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make docs-release-check PYTHON=.venv-docs/bin/python
      - name: Download the benchmark snapshot from this workflow run
        if: needs.benchmark-data.result == 'success' && needs.benchmark-data.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-benchmark-snapshot
          path: target/public-benchmark
      - name: Check sources and build the public site
        env:
          DOCS_BENCHMARK_SNAPSHOT: ${{ needs.benchmark-data.result == 'success' && needs.benchmark-data.outputs.run_id != '' && 'target/public-benchmark/snapshot.json' || '' }}
          DOCS_BENCHMARK_REVISION: ${{ needs.benchmark-data.result == 'success' && needs.benchmark-data.outputs.head_sha || '' }}
        run: make docs-test docs-lint docs-build PYTHON=.venv-docs/bin/python
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: target/site

  deploy:
    needs: [build, examples]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        ((github.event.workflow_run.name == 'Benchmark' &&
          github.event.workflow_run.head_branch == 'main' &&
          (github.event.workflow_run.event == 'push' ||
           github.event.workflow_run.event == 'schedule' ||
           github.event.workflow_run.event == 'workflow_dispatch')) ||
         (github.event.workflow_run.name == 'Release' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_branch, 'v')))))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Ensure the built site matches current main
        id: freshness
        env:
          BUILT_SHA: ${{ needs.build.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$BUILT_SHA" != "$latest_sha" ]]; then
            echo "Built site revision $BUILT_SHA is behind main at $latest_sha; skipping deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.freshness.outputs.deploy == 'true'
      - name: Publish the validated artifact
        id: deployment
        continue-on-error: true
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait for a previous Pages deployment to clear
        if: steps.freshness.outputs.deploy == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 180

      - name: Retry the Pages deployment once
        id: deployment_retry
        if: steps.freshness.outputs.deploy == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  examples:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        ((github.event.workflow_run.name == 'Benchmark' &&
          github.event.workflow_run.head_branch == 'main' &&
          (github.event.workflow_run.event == 'push' ||
           github.event.workflow_run.event == 'schedule' ||
           github.event.workflow_run.event == 'workflow_dispatch')) ||
         (github.event.workflow_run.name == 'Release' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_branch, 'v')))))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - name: Execute the documented Rust quickstart
        env:
          RUSTC_WRAPPER: ''
        run: make docs-examples
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
      - name: Execute examples using published packages
        run: make docs-registry-examples PYTHON=python
