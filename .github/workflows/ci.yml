name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.1"
  COVERAGE_TOOLCHAIN: "nightly-2026-07-16"
  NODE_VERSION: "22.14.0"
  NPM_VERSION: "11.5.1"

jobs:
  quality:
    name: Format, lint, and parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Verify retained third-party legal texts
        run: python3 scripts/verify_third_party_licenses.py
      - name: Verify malformed-class ledger
        run: python3 scripts/generate_malformed_ledger.py --check
      - name: Verify claim ledger
        run: python3 scripts/verify_claim_ledger.py
      - name: Verify coverage-origin inventory
        run: python3 scripts/verify_coverage_origins.py
      - name: Verify diagnostic provenance
        run: python3 scripts/verify_diagnostic_provenance.py
      - name: Verify Pillow-unreachable contract map
        run: python3 scripts/verify_unreachable_contracts.py
      - name: Verify release package surface
        run: python3 scripts/verify_package_surface.py
      - name: Verify roadmap status and planned-gap ledger
        run: python3 scripts/verify_roadmap.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Lint the checked-in production benchmark harness
        run: |
          cargo fmt --manifest-path benchmarks/jpeg-production/rust/Cargo.toml -- --check
          cargo clippy --manifest-path benchmarks/jpeg-production/rust/Cargo.toml --release --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - run: cargo test --locked --all-features --test coverage_matrix_tests
      - name: Test native, core-WASM, and WASI runtime feature matrix
        run: scripts/test_feature_matrix.sh
      - run: cargo package --locked
      - name: Verify clean consumer against the release archive
        run: python3 scripts/verify_package_consumer.py

  supply-chain:
    name: Dependencies and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.COVERAGE_TOOLCHAIN }}
          components: llvm-tools-preview
      - name: Install pinned coverage driver
        run: cargo +${COVERAGE_TOOLCHAIN} install cargo-llvm-cov --locked --version 0.8.7
      - name: Run aggregate all-feature coverage
        run: >-
          cargo +${COVERAGE_TOOLCHAIN} llvm-cov --all-features --branch --json
          --output-path coverage.json --no-fail-fast
      - name: Require complete line, branch, function, and region coverage
        run: python3 scripts/verify_llvm_coverage.py coverage.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: llvm-coverage
          path: coverage.json
          if-no-files-found: error
