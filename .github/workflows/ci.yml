name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.1"
  # Last Python 3.12 patch with official macOS ARM64 and Windows binaries.
  PYTHON_VERSION: "3.12.10"
  COVERAGE_TOOLCHAIN: "nightly-2026-07-16"
  NODE_VERSION: "22.14.0"
  NPM_VERSION: "11.5.1"

jobs:
  quality:
    name: Format, lint, and parity
    # The committed native fixture contract is generated on Apple ARM64.
    # Run the full matrix on the same architecture so codec bytes and
    # execution metadata are compared under the recorded environment.
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          # Claim-ledger verification resolves its measured base commit.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Verify quality, parity, feature lanes, and exact package
        run: make ci-quality
      - name: Retain verified candidate bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: image-slash-star-candidate
          path: target/release-artifacts/
          if-no-files-found: error
          retention-days: 90

  supply-chain:
    name: Dependencies and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  coverage:
    name: Coverage report
    # coverage_matrix_tests includes the same Apple ARM64 execution contract
    # as the release fixture corpus.
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.COVERAGE_TOOLCHAIN }}
          components: llvm-tools-preview
      - name: Install pinned coverage driver
        run: cargo +${COVERAGE_TOOLCHAIN} install cargo-llvm-cov --locked --version 0.8.7
      - name: Measure aggregate all-feature coverage and enforce alpha floors
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/release-evidence
          log_file=target/release-evidence/coverage.log
          set +e
          make coverage 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 40 "$log_file" | tr '\n' ' ')"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=coverage failure::$summary"
            exit "$status"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: llvm-coverage
          path: |
            target/release-evidence/coverage.json
            target/release-evidence/coverage.log
          if-no-files-found: error
