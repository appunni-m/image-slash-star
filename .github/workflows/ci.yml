name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify retained third-party legal texts
        run: python3 scripts/verify_third_party_licenses.py
      - name: Verify malformed-class ledger
        run: python3 scripts/generate_malformed_ledger.py --check
      - name: Verify claim ledger
        run: python3 scripts/verify_claim_ledger.py
      - name: Verify coverage-origin inventory
        run: python3 scripts/verify_coverage_origins.py
      - name: Verify diagnostic provenance
        run: python3 scripts/verify_diagnostic_provenance.py
      - name: Verify Pillow-unreachable contract map
        run: python3 scripts/verify_unreachable_contracts.py
      - name: Verify release package surface
        run: python3 scripts/verify_package_surface.py
      - name: Install AVIF build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes meson nasm ninja-build pkg-config
      - name: Cache pinned AVIF stack
        id: avif-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/avif-oracle
          key: avif-1.4.1-dav1d-1.5.3-aom-3.13.2-libyuv-sharpyuv-linux-x64-v1
      - name: Build pinned AVIF stack
        if: steps.avif-cache.outputs.cache-hit != 'true'
        run: scripts/build_avif_stack.sh "$RUNNER_TEMP/avif-oracle" "$RUNNER_TEMP/avif-build"
      - name: Select pinned AVIF stack
        run: |
          echo "IMAGE_SLASH_STAR_AVIF_LIB_DIR=$RUNNER_TEMP/avif-oracle/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/avif-oracle/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - run: cargo test --locked --all-features --test coverage_matrix_tests
      - name: Test native, core-WASM, and WASI runtime feature matrix
        run: scripts/test_feature_matrix.sh
      - run: cargo package --allow-dirty

  supply-chain:
    name: Dependencies and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install AVIF build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes meson nasm ninja-build pkg-config
      - name: Restore pinned AVIF stack
        id: avif-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/avif-oracle
          key: avif-1.4.1-dav1d-1.5.3-aom-3.13.2-libyuv-sharpyuv-linux-x64-v1
      - name: Build pinned AVIF stack
        if: steps.avif-cache.outputs.cache-hit != 'true'
        run: scripts/build_avif_stack.sh "$RUNNER_TEMP/avif-oracle" "$RUNNER_TEMP/avif-build"
      - name: Select pinned AVIF stack
        run: |
          echo "IMAGE_SLASH_STAR_AVIF_LIB_DIR=$RUNNER_TEMP/avif-oracle/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/avif-oracle/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Run aggregate all-feature coverage
        run: >-
          cargo +nightly llvm-cov --all-features --branch --json
          --output-path coverage.json --no-fail-fast
      - name: Require complete line, branch, function, and region coverage
        run: python3 scripts/verify_llvm_coverage.py coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: llvm-coverage
          path: coverage.json
          if-no-files-found: error
