name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.1"
  COVERAGE_TOOLCHAIN: "nightly-2026-07-16"
  NODE_VERSION: "22.14.0"
  NPM_VERSION: "11.5.1"

jobs:
  quality:
    name: Format, lint, and parity
    # The committed native fixture contract is generated on Apple ARM64.
    # Run the full matrix on the same architecture so codec bytes and
    # execution metadata are compared under the recorded environment.
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Claim-ledger verification resolves its measured base commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Verify quality, parity, feature lanes, and exact package
        run: make ci-quality
      - name: Retain verified candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-slash-star-candidate
          path: target/release-artifacts/
          if-no-files-found: error
          retention-days: 90

  supply-chain:
    name: Dependencies and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  coverage:
    name: Coverage report
    # coverage_matrix_tests includes the same Apple ARM64 execution contract
    # as the release fixture corpus.
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.COVERAGE_TOOLCHAIN }}
          components: llvm-tools-preview
      - name: Install pinned coverage driver
        run: cargo +${COVERAGE_TOOLCHAIN} install cargo-llvm-cov --locked --version 0.8.7
      - name: Measure aggregate all-feature coverage and enforce alpha floors
        run: make coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llvm-coverage
          path: target/release-evidence/coverage.json
          if-no-files-found: error
