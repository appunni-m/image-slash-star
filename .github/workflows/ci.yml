name: CI

on:
  push:
    # Keep the required status on the exact Codex commit so validated changes
    # can be fast-forwarded to main without opening a pull request.
    branches: [main, "codex/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The repository Cargo config selects sccache, which hosted runners do not
  # install. Keep CI independent of that local compiler-cache wrapper.
  RUSTC_WRAPPER: ""
  RUST_TOOLCHAIN: "1.96.1"
  # Last Python 3.12 patch with official macOS ARM64 and Windows binaries.
  PYTHON_VERSION: "3.12.10"
  COVERAGE_TOOLCHAIN: "nightly-2026-07-16"
  NODE_VERSION: "22.14.0"
  NPM_VERSION: "11.5.1"

# Per-job concurrency lets a new PR cancel its stale counterpart without a
# canceled run's always-on summary job holding a workflow-wide lock. Non-PR
# groups use the unique run ID so main and manual evidence is preserved.
jobs:
  fixture-integrity:
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-fixture-integrity
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Fixture and release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The claim ledger verifies its historical measurement revision.
          fetch-depth: 0
          persist-credentials: false
      - name: Check fixture and release metadata
        run: make verify-fixture-integrity

  quality:
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-quality
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Format, lint, and parity
    needs: fixture-integrity
    # The committed native fixture contract is generated on Apple ARM64.
    # GitHub's macos-15 label selects Apple silicon and avoids the retiring
    # macos-14 image while keeping the parity architecture unchanged.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Claim-ledger verification resolves its measured base commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm Apple silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked fixture and Pillow oracle dependencies
        run: >-
          python -m pip install --require-hashes
          --requirement requirements-ci.txt
          --requirement oracle-requirements.txt
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - name: Install pinned nightly Clippy for coverage-hook lint
        run: rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Verify quality, parity, feature lanes, and exact package
        run: make ci-quality
      - name: Retain verified candidate bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-slash-star-candidate
          path: target/release-artifacts/
          overwrite: true
          if-no-files-found: error
          retention-days: 90

  x86-simd-lint:
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-x86-simd-lint
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: x86 SSE2 and AVX2 checks
    needs: fixture-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Install pinned nightly coverage toolchain
        run: rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      # The shared target root includes dependency artifacts for both
      # architecture-specific target directories while keeping builds isolated.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Lint the x86-64 SSE2 baseline and AVX2 builds
        run: make lint-x86-simd
      - name: Install pinned coverage driver
        run: cargo +"$COVERAGE_TOOLCHAIN" install cargo-llvm-cov --locked --version 0.8.7
      - name: Verify x86 coverage selectors resolve to runnable tests
        env:
          CARGO_TARGET_DIR: target/x86_64-sse2-coverage
          RUSTFLAGS: -C target-cpu=x86-64 --cfg coverage --cfg coverage_nightly
        run: |
          set -euo pipefail
          test_list="$(cargo +"$COVERAGE_TOOLCHAIN" test --all-features --locked --test coverage_matrix_tests -- --list)"
          for test_name in \
            test_decode_matrix_jpeg \
            test_encode_matrix_jpeg \
            test_decode_matrix_avif \
            test_encode_matrix_avif \
            test_fault_contract_matrix; do
            if ! grep -Fqx "${test_name}: test" <<<"$test_list"; then
              echo "Coverage selector does not resolve to a runnable test: ${test_name}" >&2
              exit 1
            fi
          done
      - name: Run x86-64 public JPEG and AVIF parity with branch coverage
        env:
          CARGO_TARGET_DIR: target/x86_64-sse2-coverage
          RUSTFLAGS: -C target-cpu=x86-64
        run: |
          mkdir -p target/release-evidence
          cargo +"$COVERAGE_TOOLCHAIN" llvm-cov test --all-features --branch --locked --json \
            --output-path target/release-evidence/coverage-jpeg-x86_64.json \
            --test coverage_matrix_tests test_decode_matrix_jpeg -- --exact
          cargo +"$COVERAGE_TOOLCHAIN" llvm-cov test --all-features --branch --locked --json \
            --output-path target/release-evidence/coverage-jpeg-encode-x86_64.json \
            --test coverage_matrix_tests test_encode_matrix_jpeg -- --exact
          cargo +"$COVERAGE_TOOLCHAIN" llvm-cov test --all-features --branch --locked --json \
            --output-path target/release-evidence/coverage-avif-x86_64.json \
            --test coverage_matrix_tests test_decode_matrix_avif -- --exact
          cargo +"$COVERAGE_TOOLCHAIN" llvm-cov test --all-features --branch --locked --json \
            --output-path target/release-evidence/coverage-avif-encode-x86_64.json \
            --test coverage_matrix_tests test_encode_matrix_avif -- --exact
          cargo +"$COVERAGE_TOOLCHAIN" llvm-cov test --all-features --branch --locked --json \
            --output-path target/release-evidence/coverage-fault-contract-x86_64.json \
            --test coverage_matrix_tests test_fault_contract_matrix -- --exact
      - name: Run AVX2 public JPEG and AVIF parity with branch coverage
        env:
          CARGO_TARGET_DIR: target/x86_64-avx2-coverage
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=+avx2
        run: |
          if ! grep -qw avx2 /proc/cpuinfo; then
            echo "AVX2 is required for this x86 parity lane" >&2
            exit 1
          fi
          mkdir -p target/release-evidence
          cargo +"$COVERAGE_TOOLCHAIN" llvm-cov test --all-features --branch --locked --json \
            --output-path target/release-evidence/coverage-jpeg-x86_64-avx2.json \
            --test coverage_matrix_tests test_decode_matrix_jpeg -- --exact
          cargo +"$COVERAGE_TOOLCHAIN" llvm-cov test --all-features --branch --locked --json \
            --output-path target/release-evidence/coverage-jpeg-encode-x86_64-avx2.json \
            --test coverage_matrix_tests test_encode_matrix_jpeg -- --exact
          cargo +"$COVERAGE_TOOLCHAIN" llvm-cov test --all-features --branch --locked --json \
            --output-path target/release-evidence/coverage-avif-x86_64-avx2.json \
            --test coverage_matrix_tests test_decode_matrix_avif -- --exact
          cargo +"$COVERAGE_TOOLCHAIN" llvm-cov test --all-features --branch --locked --json \
            --output-path target/release-evidence/coverage-avif-encode-x86_64-avx2.json \
            --test coverage_matrix_tests test_encode_matrix_avif -- --exact
          cargo +"$COVERAGE_TOOLCHAIN" llvm-cov test --all-features --branch --locked --json \
            --output-path target/release-evidence/coverage-fault-contract-x86_64-avx2.json \
            --test coverage_matrix_tests test_fault_contract_matrix -- --exact
      - name: Verify all x86 coverage reports were produced
        run: |
          for report in \
            target/release-evidence/coverage-jpeg-x86_64.json \
            target/release-evidence/coverage-jpeg-encode-x86_64.json \
            target/release-evidence/coverage-avif-x86_64.json \
            target/release-evidence/coverage-avif-encode-x86_64.json \
            target/release-evidence/coverage-fault-contract-x86_64.json \
            target/release-evidence/coverage-fault-contract-x86_64-avx2.json \
            target/release-evidence/coverage-jpeg-x86_64-avx2.json \
            target/release-evidence/coverage-jpeg-encode-x86_64-avx2.json \
            target/release-evidence/coverage-avif-x86_64-avx2.json \
            target/release-evidence/coverage-avif-encode-x86_64-avx2.json; do
            test -s "$report" || {
              echo "Missing or empty coverage report: $report" >&2
              exit 1
            }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: x86-codec-simd-coverage
          overwrite: true
          path: |
            target/release-evidence/coverage-jpeg-x86_64.json
            target/release-evidence/coverage-jpeg-encode-x86_64.json
            target/release-evidence/coverage-jpeg-x86_64-avx2.json
            target/release-evidence/coverage-jpeg-encode-x86_64-avx2.json
            target/release-evidence/coverage-avif-x86_64.json
            target/release-evidence/coverage-avif-encode-x86_64.json
            target/release-evidence/coverage-fault-contract-x86_64.json
            target/release-evidence/coverage-fault-contract-x86_64-avx2.json
            target/release-evidence/coverage-avif-x86_64-avx2.json
            target/release-evidence/coverage-avif-encode-x86_64-avx2.json
          if-no-files-found: warn
          retention-days: 90

  windows-msvc:
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-windows-msvc
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Windows MSVC runtime and strict lint
    needs: fixture-integrity
    # Keep the OS/MSVC image stable; advance deliberately after CI review.
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      # The repository Cargo config selects sccache, which is not installed on
      # the hosted Windows runner. Let Cargo invoke rustc directly here.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Record Windows, MSVC, and SDK versions
        shell: pwsh
        run: |
          Get-ComputerInfo -Property WindowsProductName, WindowsVersion, OsBuildNumber | Format-List
          rustc --version --verbose

          $programFilesX86 = [System.Environment]::GetFolderPath('ProgramFilesX86')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw 'The Windows runner has no Visual C++ toolchain installation.'
          }

          $msvcRoot = Join-Path $vsInstall 'VC\Tools\MSVC'
          $msvc = Get-ChildItem $msvcRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $msvc) {
            throw 'The Windows runner has no MSVC toolset version directory.'
          }
          Write-Output "MSVC toolset: $($msvc.Name)"

          $sdkRoot = Join-Path $programFilesX86 'Windows Kits\10\Include'
          $sdkVersions = Get-ChildItem $sdkRoot -Directory | ForEach-Object Name
          Write-Output "Windows SDK versions: $($sdkVersions -join ', ')"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check all features on Windows MSVC
        run: cargo check --workspace --all-features --locked
      - name: Run strict Clippy on Windows MSVC
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run all-feature runtime and parity tests on Windows MSVC
        run: cargo test --workspace --all-features --locked

  supply-chain:
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-supply-chain
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Dependencies and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  documentation:
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-documentation
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Documentation build and examples
    # Put PR documentation checks in this workflow so the stable CI aggregate
    # waits for them on the same SHA. The Documentation workflow handles
    # main, scheduled, and manual site publications.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          --component rustfmt,clippy
          --target wasm32-unknown-unknown,wasm32-wasip1
          && rustup default "$RUST_TOOLCHAIN"
      - name: Install hash-locked documentation tools
        run: make docs-setup PYTHON=python
      - name: Check documentation and build the public site
        run: make docs-test docs-lint docs-build PYTHON=.venv-docs/bin/python
      - name: Execute the documented Rust quickstart
        run: make docs-examples
      - name: Execute examples using published packages
        run: make docs-registry-examples PYTHON=python

  coverage:
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-coverage
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Coverage report
    # Per-push CI keeps focused parity and x86 coverage. Run the full suite
    # weekly or on demand to keep an exploration baseline without repeating it
    # for every metadata-only commit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: fixture-integrity
    # Oracle references were captured under the Apple ARM64 all-feature
    # contract; measure the full suite on the matching supported runner.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm Apple silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.COVERAGE_TOOLCHAIN }}
          components: llvm-tools-preview
      - name: Install pinned coverage driver
        run: cargo +${COVERAGE_TOOLCHAIN} install cargo-llvm-cov --locked --version 0.8.7
      - name: Measure aggregate all-feature coverage and enforce alpha floors
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/release-evidence
          log_file=target/release-evidence/coverage.log
          set +e
          make coverage 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 40 "$log_file" | tr '\n' ' ')"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=coverage failure::$summary"
            exit "$status"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: llvm-coverage
          overwrite: true
          path: |
            target/release-evidence/coverage.json
            target/release-evidence/coverage.log
          if-no-files-found: error

  required-checks:
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-required-checks
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Required CI checks
    # Run the result gate after cancellation so canceled required lanes fail
    # this stable check instead of leaving a skipped, green required context.
    if: always()
    needs:
      - fixture-integrity
      - quality
      - x86-simd-lint
      - windows-msvc
      - supply-chain
      - documentation
      - coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every applicable CI job to pass
        env:
          EVENT_NAME: ${{ github.event_name }}
          FIXTURE_RESULT: ${{ needs.fixture-integrity.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          X86_RESULT: ${{ needs.x86-simd-lint.result }}
          WINDOWS_RESULT: ${{ needs.windows-msvc.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          DOCS_RESULT: ${{ needs.documentation.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: python3 scripts/verify_ci_results.py
