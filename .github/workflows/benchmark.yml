name: Benchmark
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/benchmark.yml'
      - 'benchmarks/jpeg-production/**'
      - 'scripts/setup_benchmark_oracle.py'
      - 'scripts/docs_evidence.py'
      - 'docs.mk'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'rust-toolchain.toml'
      - 'src/**'
  workflow_dispatch:
  schedule:
    - cron: '59 3 * * 1'
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  RUSTC_WRAPPER: ''
  RUST_TOOLCHAIN: '1.96.1'
jobs:
  benchmark:
    runs-on: macos-15
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm Apple silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Install the pinned Rust toolchain and WASM target
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
      - name: Build the pinned oracle and measure the full matrix
        run: make bench-setup bench PYTHON=python
      - name: Validate and export the public measurement
        run: make docs-benchmark DOCS_BENCHMARK_SOURCE=target/benchmarks/jpeg/latest DOCS_BENCHMARK_OUTPUT=target/public-benchmark/snapshot.json PYTHON=python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-benchmark
          path: target/public-benchmark/snapshot.json
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-${{ github.run_id }}
          overwrite: true
          path: target/benchmarks/jpeg/
          if-no-files-found: warn
