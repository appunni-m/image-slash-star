# Tag-driven publication is enabled only after the first local bootstrap.
# The workflow verifies the pushed tag and never creates or moves one.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.96.1"
  COVERAGE_TOOLCHAIN: "nightly-2026-07-16"

jobs:
  preflight:
    name: Verify immutable release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - name: Install pinned release tools
        run: |
          rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
          cargo +"$COVERAGE_TOOLCHAIN" install cargo-llvm-cov --locked --version 0.8.7
          cargo install cargo-deny --locked --version 0.20.2
      - name: Verify annotated tag and exact package version
        shell: bash
        run: |
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          release_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          test "$release_commit" = "$(git rev-parse HEAD)"
          version="${GITHUB_REF_NAME#v}"
          actual="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "image-slash-star") | .version')"
          test "$actual" = "$version"
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" \
            --jq '.workflow_runs[0].id // empty')"
          test -n "$run_id"
      - name: Run complete release gate
        run: make release-verify
      - name: Retain verified candidate bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: image-slash-star-candidate-${{ github.ref_name }}
          path: target/release-artifacts/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish image-slash-star to crates.io
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image-slash-star-candidate-${{ github.ref_name }}
          path: candidate-bundle
      - name: Verify candidate checksum
        run: (cd candidate-bundle && sha256sum --check SHA256SUMS)
      - name: Authenticate to crates.io with OIDC
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish and compare exact candidate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          RELEASE_APPROVED: "1"
          RELEASE_CI_SHA: ${{ github.sha }}
        run: |
          mkdir -p registry-bundle
          python3 scripts/publish_release.py \
            --candidate "candidate-bundle/image-slash-star-${GITHUB_REF_NAME#v}.crate" \
            --output "registry-bundle/image-slash-star-${GITHUB_REF_NAME#v}.crate" \
            --publish-if-missing
          cp candidate-bundle/release-notes.md registry-bundle/
          (cd registry-bundle && sha256sum image-slash-star-*.crate > SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: image-slash-star-registry-${{ github.ref_name }}
          path: registry-bundle/
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: Create immutable GitHub prerelease
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image-slash-star-registry-${{ github.ref_name }}
          path: registry-bundle
      - name: Verify canonical registry checksum
        run: (cd registry-bundle && sha256sum --check SHA256SUMS)
      - name: Attest the canonical registry archive
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            registry-bundle/image-slash-star-*.crate
            registry-bundle/SHA256SUMS
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --title "image-slash-star ${GITHUB_REF_NAME#v}" \
            --notes-file registry-bundle/release-notes.md \
            registry-bundle/image-slash-star-*.crate registry-bundle/SHA256SUMS
