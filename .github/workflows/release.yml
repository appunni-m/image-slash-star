# Tag-driven publication is enabled only after the first local bootstrap.
# The workflow verifies the pushed tag and never creates or moves one.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTC_WRAPPER: ""
  RUST_TOOLCHAIN: "1.96.1"
  # Last Python 3.12 patch with official macOS ARM64 and Windows binaries.
  PYTHON_VERSION: "3.12.10"
  COVERAGE_TOOLCHAIN: "nightly-2026-07-16"

jobs:
  preflight:
    name: Verify immutable release candidate
    # Reuse artifacts from successful main CI on the exact tagged commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - name: Verify annotated tag and exact package version
        shell: bash
        run: |
          set -euo pipefail
          # checkout may materialize a peeled tag; inspect the original object
          # through a separate ref without moving the release tag.
          git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/release-verification/tag"
          test "$(git cat-file -t refs/release-verification/tag)" = tag
          test "$(git rev-parse 'refs/release-verification/tag^{commit}')" = "$(git rev-parse HEAD)"
          RELEASE_TAG="$GITHUB_REF_NAME" make release-check-version
      - name: Require successful main CI for this commit
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=50" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | sort_by(.updated_at) | last | .id // empty')"
          test -n "$run_id"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the candidate verified by exact main CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci-run.outputs.run-id }}
          name: image-slash-star-candidate
          path: target/release-artifacts
      - name: Verify candidate bundle
        run: (cd target/release-artifacts && sha256sum --check SHA256SUMS)
      - name: Retain verified candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-slash-star-candidate-${{ github.ref_name }}
          path: target/release-artifacts/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish image-slash-star to crates.io
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-slash-star-candidate-${{ github.ref_name }}
          path: target/candidate-bundle
      - name: Verify candidate checksum
        run: (cd target/candidate-bundle && sha256sum --check SHA256SUMS)
      - name: Reproduce and compile the exact candidate before authentication
        run: >-
          make release-publish-prepare
          VERIFIED_CRATE="target/candidate-bundle/image-slash-star-${GITHUB_REF_NAME#v}.crate"
      - name: Authenticate to crates.io with OIDC
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish and compare exact candidate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          RELEASE_CI_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/registry-bundle
          log_file="${RUNNER_TEMP}/image-slash-star-publish.log"
          set +e
          make release-publish-oidc \
            VERIFIED_CRATE="target/candidate-bundle/image-slash-star-${GITHUB_REF_NAME#v}.crate" \
            REGISTRY_OUTPUT="target/registry-bundle/image-slash-star-${GITHUB_REF_NAME#v}.crate" \
            2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 35 "$log_file" | tr '\n' ' ')"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=crate publish or verification failure::$summary"
            exit "$status"
          fi
          cp target/candidate-bundle/release-notes.md target/registry-bundle/
          (cd target/registry-bundle && sha256sum image-slash-star-*.crate > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-slash-star-registry-${{ github.ref_name }}
          path: target/registry-bundle/
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: Create immutable GitHub prerelease
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-slash-star-registry-${{ github.ref_name }}
          path: registry-bundle
      - name: Verify canonical registry checksum
        run: (cd registry-bundle && sha256sum --check SHA256SUMS)
      - name: Attest the canonical registry archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            registry-bundle/image-slash-star-*.crate
            registry-bundle/SHA256SUMS
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --title "image-slash-star ${GITHUB_REF_NAME#v}" \
            --notes-file registry-bundle/release-notes.md \
            registry-bundle/image-slash-star-*.crate registry-bundle/SHA256SUMS
