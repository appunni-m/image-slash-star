# Tag-driven publication is enabled only after the first local bootstrap.
# The workflow verifies the pushed tag and never creates or moves one.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTC_WRAPPER: ""
  RUST_TOOLCHAIN: "1.96.1"
  # Last Python 3.12 patch with official macOS ARM64 and Windows binaries.
  PYTHON_VERSION: "3.12.10"
  COVERAGE_TOOLCHAIN: "nightly-2026-07-16"

jobs:
  preflight:
    name: Verify immutable release candidate
    # Reuse artifacts from successful main CI on the exact tagged commit.
    runs-on: ubuntu-24.04
    # The package fallback performs the same cross-target verification as
    # package-verify, which can take longer on a cold runner.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify annotated tag and exact package version
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_tag.py
          RELEASE_TAG="$GITHUB_REF_NAME" make release-check-version
      - name: Require successful main CI for this commit
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api \
            --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '[.[] | .workflow_runs[] | select(.event == "push" and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | sort_by(.updated_at) | last | .id // empty')"
          test -n "$run_id"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the candidate verified by exact main CI
        id: candidate-artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci-run.outputs.run-id }}
          name: image-slash-star-candidate
          path: target/release-artifacts
      - name: Rebuild and verify the candidate when the CI artifact is unavailable
        if: steps.candidate-artifact.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/release-artifacts
          RELEASE_TAG="$GITHUB_REF_NAME" make package-verify PYTHON=python3
      - name: Verify candidate bundle
        run: (cd target/release-artifacts && sha256sum --check SHA256SUMS)
      - name: Retain verified candidate bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-slash-star-candidate-${{ github.ref_name }}
          overwrite: true
          path: target/release-artifacts/
          if-no-files-found: error
          retention-days: 90

  release-coverage:
    name: Measure coverage for tagged source
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm Apple silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.COVERAGE_TOOLCHAIN }}
          components: llvm-tools-preview
      - name: Install pinned coverage driver
        run: cargo +${COVERAGE_TOOLCHAIN} install cargo-llvm-cov --locked --version 0.8.7
      - name: Measure aggregate all-feature coverage and enforce alpha floors
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/release-evidence
          log_file=target/release-evidence/coverage.log
          set +e
          make coverage 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 40 "$log_file" | tr '\n' ' ')"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=release coverage failure::$summary"
            exit "$status"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: llvm-coverage-release-${{ github.ref_name }}
          overwrite: true
          path: |
            target/release-evidence/coverage.json
            target/release-evidence/coverage.log
          if-no-files-found: error
          retention-days: 90

  prepare-publish:
    name: Prepare the verified crates.io request
    needs: [preflight, release-coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-slash-star-candidate-${{ github.ref_name }}
          path: target/candidate-bundle
      - name: Verify candidate checksum
        run: (cd target/candidate-bundle && sha256sum --check SHA256SUMS)
      - name: Recheck annotated tag before package preparation
        run: python3 scripts/verify_release_tag.py
      - name: Reproduce and compile the exact candidate without OIDC permission
        run: >-
          make release-publish-prepare
          VERIFIED_CRATE="target/candidate-bundle/image-slash-star-${GITHUB_REF_NAME#v}.crate"
      - name: Frame the exact candidate for the crates.io API
        run: >-
          make release-publish-request PYTHON=python3
          VERIFIED_CRATE="target/candidate-bundle/image-slash-star-${GITHUB_REF_NAME#v}.crate"
          PUBLISH_REQUEST="target/crates-io-publish/crates-io-upload.bin"
      - name: Check the framed request
        run: |
          cp "target/candidate-bundle/image-slash-star-${GITHUB_REF_NAME#v}.crate" \
            target/crates-io-publish/
          (cd target/crates-io-publish && \
            sha256sum crates-io-upload.bin "image-slash-star-${GITHUB_REF_NAME#v}.crate" \
              > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-slash-star-crates-io-request-${{ github.ref_name }}
          overwrite: true
          path: target/crates-io-publish/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish the verified archive to crates.io
    needs: [preflight, release-coverage, prepare-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-slash-star-crates-io-request-${{ github.ref_name }}
          path: target/crates-io-publish
      - name: Verify publish request checksum
        run: (cd target/crates-io-publish && sha256sum --check SHA256SUMS)
      - name: Check whether this exact crate version is already published
        id: existing-version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          response_file="${RUNNER_TEMP}/crates-io-existing-version.json"
          status="$(curl --config /dev/null \
            --proto '=https' \
            --silent --show-error --connect-timeout 10 --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/image-slash-star/${version}")"
          if [[ "$status" == 404 ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
            expected="$(sha256sum "target/crates-io-publish/image-slash-star-${version}.crate" | cut -d ' ' -f 1)"
            actual="$(jq -r '.version.checksum // empty' "$response_file")"
            [[ "$actual" == "$expected" ]] || {
              echo "crates.io already contains ${version} with different archive bytes" >&2
              exit 1
            }
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            cat "$response_file" >&2
            echo "crates.io version lookup returned HTTP ${status}" >&2
            exit 1
          fi
      - name: Verify the remote annotated tag still names this commit
        id: verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == v* ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          [[ "$(jq -r '.object.type' <<< "$tag_ref")" == "tag" ]]
          tag_object_sha="$(jq -r '.object.sha' <<< "$tag_ref")"
          [[ "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]]
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
          [[ "$(jq -r '.object.type' <<< "$tag_object")" == "commit" ]]
          tag_commit="$(jq -r '.object.sha' <<< "$tag_object")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "verified annotated tag ${GITHUB_REF_NAME} at ${tag_commit}"
      - name: Authenticate to crates.io with OIDC
        id: crates-io-auth
        if: steps.existing-version.outputs.present != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Upload the verified archive to crates.io
        if: steps.existing-version.outputs.present != 'true'
        env:
          CRATES_IO_PUBLISH_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/crates-io-publish-response.json"
          status="$(curl --config /dev/null \
            --proto '=https' \
            --silent --show-error --connect-timeout 10 --max-time 300 \
            --output "$response_file" --write-out '%{http_code}' \
            --request PUT \
            --header "Authorization: ${CRATES_IO_PUBLISH_TOKEN}" \
            --header 'Content-Type: application/octet-stream' \
            --header 'Accept: application/json' \
            --data-binary @target/crates-io-publish/crates-io-upload.bin \
            https://crates.io/api/v1/crates/new)"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            cat "$response_file" >&2
            echo "crates.io publish request returned HTTP ${status}" >&2
            exit 1
          fi
          if ! jq -e 'type == "object" and (has("errors") | not)' \
            "$response_file" >/dev/null; then
            cat "$response_file" >&2
            echo "crates.io returned an error payload for the publish request" >&2
            exit 1
          fi

  verify-registry:
    name: Verify the published archive against the candidate
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-slash-star-candidate-${{ github.ref_name }}
          path: target/candidate-bundle
      - name: Verify candidate checksum
        run: (cd target/candidate-bundle && sha256sum --check SHA256SUMS)
      - name: Wait for the crate and compare registry bytes
        run: >-
          python3 scripts/publish_release.py
          --wait-until-visible
          --candidate "target/candidate-bundle/image-slash-star-${GITHUB_REF_NAME#v}.crate"
          --output "target/registry-bundle/image-slash-star-${GITHUB_REF_NAME#v}.crate"
      - name: Retain the verified registry bundle
        run: |
          cp target/candidate-bundle/release-notes.md target/registry-bundle/
          (cd target/registry-bundle && sha256sum image-slash-star-*.crate > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-slash-star-registry-${{ github.ref_name }}
          overwrite: true
          path: target/registry-bundle/
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: Create immutable GitHub prerelease
    needs: verify-registry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-slash-star-registry-${{ github.ref_name }}
          path: registry-bundle
      - name: Verify canonical registry checksum
        run: (cd registry-bundle && sha256sum --check SHA256SUMS)
      - name: Verify the remote annotated tag still names this commit
        id: verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == v* ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          [[ "$(jq -r '.object.type' <<< "$tag_ref")" == "tag" ]]
          tag_object_sha="$(jq -r '.object.sha' <<< "$tag_ref")"
          [[ "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]]
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
          [[ "$(jq -r '.object.type' <<< "$tag_object")" == "commit" ]]
          tag_commit="$(jq -r '.object.sha' <<< "$tag_object")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "verified annotated tag ${GITHUB_REF_NAME} at ${tag_commit}"
      - name: Attest the canonical registry archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            registry-bundle/image-slash-star-*.crate
            registry-bundle/SHA256SUMS
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_TAG_COMMIT: ${{ steps.verify-tag.outputs.tag_commit }}
        run: |
          # Keep this inline logic mirrored in scripts/github_release_publish.sh for tests.
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          repo="$GH_REPO"
          bundle_dir=registry-bundle
          crate_name="image-slash-star-${version}.crate"
          expected_title="image-slash-star ${version}"
          crate_path="$bundle_dir/$crate_name"
          checksums_path="$bundle_dir/SHA256SUMS"
          notes_path="$bundle_dir/release-notes.md"

          [[ "$VERIFIED_TAG_COMMIT" == "$GITHUB_SHA" ]] || {
            echo "The pre-attestation tag check did not resolve to GITHUB_SHA." >&2
            exit 1
          }
          [[ -s "$crate_path" && -s "$checksums_path" && -s "$notes_path" ]] || {
            echo "The verified registry bundle is incomplete." >&2
            exit 1
          }
          (cd "$bundle_dir" && sha256sum --check SHA256SUMS)

          crate_digest="$(sha256sum "$crate_path" | cut -d ' ' -f 1)"
          checksums_digest="$(sha256sum "$checksums_path" | cut -d ' ' -f 1)"
          expected_body="$RUNNER_TEMP/github-release-notes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          cp "$notes_path" "$expected_body"
          printf '\n<!-- image-slash-star-release tag=%s commit=%s crate-sha256=%s checksums-sha256=%s -->\n' \
            "$tag" "$GITHUB_SHA" "$crate_digest" "$checksums_digest" \
            >> "$expected_body"

          release_endpoint="repos/$repo/releases/tags/$tag"
          release_file="$RUNNER_TEMP/github-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          release_error="$RUNNER_TEMP/github-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.error"
          release_state=

          fetch_release() {
            if gh api "$release_endpoint" > "$release_file" 2> "$release_error"; then
              release_state=present
            elif grep -Eq 'HTTP 404([^0-9]|$)' "$release_error"; then
              release_state=absent
            else
              echo "Unable to determine the GitHub release state; failing closed." >&2
              cat "$release_error" >&2
              return 1
            fi
          }

          validate_release_metadata() {
            jq -e \
              --arg tag "$tag" \
              --arg title "$expected_title" \
              --arg crate "$crate_name" \
              --rawfile body "$expected_body" \
              'type == "object"
               and .tag_name == $tag
               and .name == $title
               and .body == $body
               and .prerelease == true
               and (.draft | type == "boolean")
               and (.assets | type == "array"
                    and all(.[]; .state == "uploaded"
                            and (.name == $crate or .name == "SHA256SUMS")))
               and (if .draft == false
                    then ([.assets[].name] | sort) == ([$crate, "SHA256SUMS"] | sort)
                    else true
                    end)' \
              "$release_file" >/dev/null
          }

          has_asset() {
            jq -e --arg name "$1" \
              '.assets | any(.[]; .name == $name)' \
              "$release_file" >/dev/null
          }

          verify_present_assets() {
            local download_dir asset
            local patterns=()
            download_dir="$(mktemp -d "$RUNNER_TEMP/github-release-assets.XXXXXX")"
            for asset in "$crate_name" SHA256SUMS; do
              if has_asset "$asset"; then
                patterns+=(--pattern "$asset")
              fi
            done
            if ((${#patterns[@]} > 0)); then
              gh release download "$tag" --repo "$repo" \
                --dir "$download_dir" "${patterns[@]}"
              for asset in "$crate_name" SHA256SUMS; do
                if has_asset "$asset"; then
                  if [[ ! -f "$download_dir/$asset" ]] \
                    || ! cmp -s -- "$bundle_dir/$asset" "$download_dir/$asset"; then
                    echo "GitHub release asset '$asset' does not match the verified registry bundle." >&2
                    rm -rf -- "$download_dir"
                    return 1
                  fi
                fi
              done
            fi
            rm -rf -- "$download_dir"
          }

          verify_tag_commit() {
            local tag_ref tag_object tag_object_sha tag_commit
            if ! tag_ref="$(gh api "repos/$repo/git/ref/tags/$tag")"; then
              echo "Unable to revalidate the remote annotated tag before publishing." >&2
              return 1
            fi
            [[ "$(jq -r '.object.type // empty' <<< "$tag_ref")" == tag ]] || {
              echo "The remote release tag is no longer annotated." >&2
              return 1
            }
            tag_object_sha="$(jq -r '.object.sha // empty' <<< "$tag_ref")"
            [[ "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "The remote annotated tag object has an invalid SHA." >&2
              return 1
            }
            if ! tag_object="$(gh api "repos/$repo/git/tags/$tag_object_sha")"; then
              echo "Unable to resolve the remote annotated tag object." >&2
              return 1
            fi
            [[ "$(jq -r '.object.type // empty' <<< "$tag_object")" == commit ]] || {
              echo "The remote annotated tag does not point directly to a commit." >&2
              return 1
            }
            tag_commit="$(jq -r '.object.sha // empty' <<< "$tag_object")"
            [[ "$tag_commit" == "$GITHUB_SHA" && "$tag_commit" == "$VERIFIED_TAG_COMMIT" ]] || {
              echo "The remote release tag no longer resolves to the verified commit." >&2
              return 1
            }
          }

          fetch_release
          if [[ "$release_state" == absent ]]; then
            create_log="$RUNNER_TEMP/github-release-create-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
            if ! gh release create "$tag" --repo "$repo" \
              --verify-tag --draft --prerelease --title "$expected_title" \
              --notes-file "$expected_body" > "$create_log" 2>&1; then
              echo "Draft creation returned an error; checking whether GitHub accepted it." >&2
            fi
            fetch_release
            if [[ "$release_state" == absent ]]; then
              cat "$create_log" >&2
              echo "GitHub did not create a draft release for $tag." >&2
              exit 1
            fi
          fi

          if ! validate_release_metadata; then
            echo "An existing release has a different tag, commit marker, title, notes, type, or unexpected assets; no changes were made." >&2
            exit 1
          fi
          if ! verify_present_assets; then
            echo "An existing release asset is not the verified registry artifact; no changes were made." >&2
            exit 1
          fi

          if [[ "$(jq -r '.draft' "$release_file")" == false ]]; then
            echo "Verified the already-published immutable GitHub release for $tag."
            exit 0
          fi

          missing_assets=()
          for asset in "$crate_name" SHA256SUMS; do
            if ! has_asset "$asset"; then
              missing_assets+=("$bundle_dir/$asset")
            fi
          done
          if ((${#missing_assets[@]} > 0)); then
            if ! gh release upload "$tag" --repo "$repo" "${missing_assets[@]}"; then
              echo "Asset upload returned an error; checking which verified assets GitHub accepted." >&2
            fi
            fetch_release
            if ! validate_release_metadata || ! verify_present_assets; then
              echo "The draft release changed unexpectedly during asset upload; no existing asset was overwritten." >&2
              exit 1
            fi
          fi

          if ! jq -e --arg crate "$crate_name" \
            '([.assets[].name] | sort) == ([$crate, "SHA256SUMS"] | sort)
             and all(.assets[]; .state == "uploaded")' \
            "$release_file" >/dev/null; then
            echo "The matching draft is incomplete; rerun this job to retry missing asset uploads." >&2
            exit 1
          fi
          if ! verify_present_assets; then
            echo "The completed draft assets differ from the verified registry bundle." >&2
            exit 1
          fi

          verify_tag_commit
          if ! gh release edit "$tag" --repo "$repo" --draft=false; then
            echo "Draft publication returned an error; checking whether GitHub published it." >&2
          fi
          fetch_release
          if [[ "$release_state" != present ]] || ! validate_release_metadata; then
            echo "Unable to verify the GitHub release after publication; no asset was overwritten." >&2
            exit 1
          fi
          if [[ "$(jq -r '.draft' "$release_file")" != false ]]; then
